output_dir: tmp
shellspec_name: "000_verify_zfs_permissions_spec"

example_list:
  - describe_desc: "Test zfs"
    tag: prune-scenario:00

    hooks_list:
      - name: BeforeRun
        invocation: evaluated_command
        command: set_zelta_systime

    shell_code: |
      Include "${SHELLSPEC_HELPERDIR}/golden_pool_helper.sh"

      ZELTA_SYSTIME_VALUE='date -d "2026-06-14 00:00:00 EDT" +%s'
      EXPECTED_SNAPSHOTS=168
      EXPECTED_PRUNE_DAILY_1_DAY_COUNT=65
      EXPECTED_PRUNE_DAILY_30_DAY_COUNT=24
      PRUNE_HOOK_DEBUG_LOG="/tmp/zelta_sandbox_prune_hooks_log.txt"

      snapshot_count() {
        out=$(tgt_exec zfs list -r -t snapshot "$1") || return
        count=$(printf '%s\n' "$out" | wc -l)
        #[ "$count" -eq "$expected" ]
        printf 'found %s snapshots\n' "$count"
      }
      
      set_zelta_systime() {
        export ZELTA_SYSTIME="$ZELTA_SYSTIME_VALUE"
        #%logger "ZELTA_SYSTIME=$ZELTA_SYSTIME"
      }

      # run the command represented by the $@ in a shell with ZELTA_SYSTIME override
      systime_cmd_count_lines() {
        out=$(set_zelta_systime; "$@")
        count=$(printf '%s\n' "$out" | wc -l)
        cmd="$@"
        #%logger "systime cmd found count $count"
        printf 'command {%s}\n\t returned line count %s\n' "$cmd" "$count"
      }
      
      # WARNING: don't use ShellSpec Before/After All hooks, they are executed even when this spec isn't selected
      # before / after hooks are not It clauses 'restores golden pools' and 'removes golden pools' respectively
      # TODO: after testing redirect stdout to /dev/null, stderr output is intended to fail the tests
      setup_pools() { make_golden_pools > $PRUNE_HOOK_DEBUG_LOG; }
      teardown_pools() { teardown_golden_pools >> $PRUNE_HOOK_DEBUG_LOG; }


    skip_if_list:
      - condition: if 'SANDBOX_ZELTA_SRC_EP undefined' test -z "$SANDBOX_ZELTA_SRC_EP"
      - condition: if 'SANDBOX_ZELTA_TGT_EP undefined' test -z "$SANDBOX_ZELTA_TGT_EP"

    test_list:
      - test_name: setup_pools
        tag: prune-scenario:00-restore
        allow_no_output: true
        it_desc: restores golden pools
        when_command: call setup_pools
#
#      - test_name: check_source_snapshot_count
#        output_clause: The output should include "$EXPECTED_SNAPSHOTS"
#        allow_no_output: true
#        it_desc: ${SANDBOX_ZELTA_SRC_EP} has $EXPECTED_SNAPSHOTS snapshots
#        when_command: call snapshot_count "$SANDBOX_ZELTA_TGT_DS"
#
#      - test_name: check_target_snapshot_count
#        output_clause: The output should include "$EXPECTED_SNAPSHOTS"
#        allow_no_output: true
#        it_desc: ${SANDBOX_ZELTA_TGT_EP} has $EXPECTED_SNAPSHOTS snapshots
#        when_command: call snapshot_count "$SANDBOX_ZELTA_TGT_DS"

      - test_name: zfs_check_delegation
        tag: prune-scenario:zfs-check
        it_desc: checks zfs delegation on ${SANDBOX_ZELTA_SRC_POOL} - %{when_command}
        when_command: call src_exec zpool get delegation "$SANDBOX_ZELTA_SRC_POOL"

      - test_name: zfs_check_allow_permissions
        tag: prune-scenario:zfs-check
        it_desc: check permissions on ${SANDBOX_ZELTA_SRC_DS}  - %{when_command}
        when_command: call src_exec zfs allow "$SANDBOX_ZELTA_SRC_DS"

      - test_name: zfs_destroy_check
        tag: prune-scenario:zfs-destroy
        it_desc: verify ability to destroy a snapshot - %{when_command}
        allow_no_output: true
        when_command: call src_exec zfs destroy $SANDBOX_ZELTA_SRC_DS@zelta_monthly_2023-07-04_21.00.00

      - test_name: teardown_pools
        tag: prune-scenario:00-teardown
        allow_no_output: true
        it_desc: teardown golden pools
        when_command: call teardown_pools

